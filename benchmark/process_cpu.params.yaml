# Seqera params for the CPU OpenPipeline bulk benchmark.
# Workflow: workflows/benchmark/process_cpu
#
# Runs the same chain as process_gpu using the equivalent CPU components, on a
# CPU-only compute environment (no `gpu` label mapping required).
#
# Use the SAME input as the GPU run so the runtimes are directly comparable. For
# a fair comparison, equalise the number of CPUs in the compute environment with
# whatever the GPU host provides, since the CPU components scale with cores.
#
# The input must be a spatial .h5mu containing raw counts and a spatial graph
# in .obsp["spatial_connectivities"] (used by the spatial_autocorr step).

param_list:
  - id: benchmark
    input: s3://YOUR-BUCKET/path/to/spatial_input.h5mu

modality: rna

publish_dir: s3://YOUR-BUCKET/path/to/results/process_cpu
