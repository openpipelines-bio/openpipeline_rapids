name: viash test

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  linting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: python -m pip install pre-commit
        shell: bash
      - run: python -m pip freeze --local
        shell: bash
      - run: pre-commit run --show-diff-on-failure --color=always --all-files
        shell: bash
      - name: Check for non-ASCII characters
        # Consumers that build with a non-UTF-8 file.encoding cannot parse configs
        # containing non-ASCII characters. When this package is used as a remote
        # dependency, the Viash dependency resolver fails there with an opaque
        # "key not found: namespace" instead of a readable encoding error.
        run: |
          if grep -rPn "[^\x00-\x7F]" src/; then
            echo "::error::Non-ASCII characters found in src/ (listed above). Use ASCII equivalents, e.g. '-' instead of an em-dash."
            exit 1
          fi
        shell: bash

  test:
    # Disabled: no GPU runner on CI yet — viash test requires --gpus all.
    # Revert once a GPU runner is available. Tracking: #30
    if: false
    uses: viash-io/viash-actions/.github/workflows/test.yaml@v6
