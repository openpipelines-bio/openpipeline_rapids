name: "spatial_autocorr"
namespace: "squidpy"
version: "build_main"
authors:
- name: "Jakub Majercik"
  roles:
  - "author"
  info:
    role: "Contributor"
    links:
      email: "jakub@data-intuitive.com"
      github: "jakubmajercik"
      linkedin: "jakubmajercik"
    organizations:
    - name: "Data Intuitive"
      href: "https://www.data-intuitive.com"
      role: "Bioinformatics Engineer"
argument_groups:
- name: "Inputs"
  arguments:
  - type: "file"
    name: "--input"
    alternatives:
    - "-i"
    description: "Input h5mu file."
    info: null
    example:
    - "input.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--modality"
    description: "Which modality from the input MuData file to process."
    info: null
    default:
    - "rna"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--layer"
    description: "Layer in the modality to use for the autocorrelation analysis.\n\
      If unset, .X is used.\n"
    info: null
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--obsp_connectivities"
    description: "In which .obsp slot the spatial connectivities can be found."
    info: null
    default:
    - "spatial_connectivities"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--input_genes"
    description: "Subset of genes (from .var_names) to compute autocorrelation for.\n\
      If unset, all genes in .var['highly_variable'] (if present) or all\ngenes will\
      \ be used.\n"
    info: null
    required: false
    direction: "input"
    multiple: true
    multiple_sep: ","
- name: "Outputs"
  arguments:
  - type: "file"
    name: "--output"
    alternatives:
    - "-o"
    description: "Output h5mu file."
    info: null
    default:
    - "output.h5mu"
    must_exist: true
    create_parent: true
    required: true
    direction: "output"
    multiple: false
    multiple_sep: ";"
  - type: "string"
    name: "--output_compression"
    description: "Compression format to use for the output AnnData and/or Mudata\n\
      objects. By default no compression is applied.\n"
    info: null
    example:
    - "gzip"
    required: false
    choices:
    - "gzip"
    - "lzf"
    direction: "input"
    multiple: false
    multiple_sep: ";"
- name: "Options"
  arguments:
  - type: "string"
    name: "--mode"
    description: "Spatial autocorrelation statistic to compute. 'moran' for Moran's\
      \ I,\n'geary' for Geary's C.\n"
    info: null
    default:
    - "moran"
    required: false
    choices:
    - "moran"
    - "geary"
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "integer"
    name: "--n_perms"
    description: "Number of permutations for the permutation-based p-value\ncalculation.\
      \ If unset, only analytical p-values are computed.\n"
    info: null
    required: false
    min: 1
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean"
    name: "--transformation"
    description: "If true, row-normalize the connectivity matrix before computation.\n"
    info: null
    default:
    - true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean_true"
    name: "--two_tailed"
    description: "If set, compute two-tailed p-values from the permutation test\n\
      instead of one-tailed.\n"
    info: null
    direction: "input"
  - type: "string"
    name: "--corr_method"
    description: "Multiple-testing correction method to apply to p-values. Any method\n\
      supported by `statsmodels.stats.multitest.multipletests`, e.g.\n'fdr_bh', 'fdr_by',\
      \ 'bonferroni', 'holm'. Pass an empty string to\ndisable correction.\n"
    info: null
    default:
    - "fdr_bh"
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
  - type: "boolean"
    name: "--use_sparse"
    description: "If true, use a sparse representation of the expression matrix on\n\
      the GPU.\n"
    info: null
    default:
    - true
    required: false
    direction: "input"
    multiple: false
    multiple_sep: ";"
resources:
- type: "python_script"
  path: "script.py"
  is_executable: true
- type: "file"
  path: "setup_logger.py"
- type: "file"
  path: "compress_h5mu.py"
- type: "file"
  path: "anndata_io.py"
- type: "file"
  path: "nextflow_labels.config"
  dest: "nextflow_labels.config"
description: "Calculate spatial autocorrelation for genes using Moran's I or Geary's\
  \ C\non a precomputed spatial neighborhood graph. Allows identification of\nspatially\
  \ variable features.\n\nRequires a spatial connectivities matrix in .obsp, e.g.\
  \ produced by\n`squidpy.gr.spatial_neighbors` or an equivalent GPU implementation.\n\
  \nThe result is written to .uns as a DataFrame: `moranI` when `--mode` is\n'moran',\
  \ or `gearyC` when `--mode` is 'geary'.\n"
test_resources:
- type: "python_script"
  path: "test.py"
  is_executable: true
- type: "file"
  path: "xenium"
info: null
status: "enabled"
scope:
  image: "public"
  target: "public"
repositories:
- type: "vsh"
  name: "openpipeline"
  repo: "openpipeline"
  tag: "v4.1.0"
- type: "vsh"
  name: "openpipeline_spatial"
  repo: "openpipeline_spatial"
  tag: "v0.5.0"
license: "MIT"
links:
  repository: "https://github.com/openpipelines-bio/openpipeline_rapids"
  docker_registry: "ghcr.io"
runners:
- type: "executable"
  id: "executable"
  docker_setup_strategy: "ifneedbepullelsecachedbuild"
  docker_run_args:
  - "--gpus all"
- type: "nextflow"
  id: "nextflow"
  directives:
    label:
    - "midmem"
    - "lowcpu"
    - "highdisk"
    - "gpu"
    tag: "$id"
  auto:
    simplifyInput: true
    simplifyOutput: false
    transcript: false
    publish: false
  config:
    labels:
      mem1gb: "memory = 1000000000.B"
      mem2gb: "memory = 2000000000.B"
      mem5gb: "memory = 5000000000.B"
      mem10gb: "memory = 10000000000.B"
      mem20gb: "memory = 20000000000.B"
      mem50gb: "memory = 50000000000.B"
      mem100gb: "memory = 100000000000.B"
      mem200gb: "memory = 200000000000.B"
      mem500gb: "memory = 500000000000.B"
      mem1tb: "memory = 1000000000000.B"
      mem2tb: "memory = 2000000000000.B"
      mem5tb: "memory = 5000000000000.B"
      mem10tb: "memory = 10000000000000.B"
      mem20tb: "memory = 20000000000000.B"
      mem50tb: "memory = 50000000000000.B"
      mem100tb: "memory = 100000000000000.B"
      mem200tb: "memory = 200000000000000.B"
      mem500tb: "memory = 500000000000000.B"
      mem1gib: "memory = 1073741824.B"
      mem2gib: "memory = 2147483648.B"
      mem4gib: "memory = 4294967296.B"
      mem8gib: "memory = 8589934592.B"
      mem16gib: "memory = 17179869184.B"
      mem32gib: "memory = 34359738368.B"
      mem64gib: "memory = 68719476736.B"
      mem128gib: "memory = 137438953472.B"
      mem256gib: "memory = 274877906944.B"
      mem512gib: "memory = 549755813888.B"
      mem1tib: "memory = 1099511627776.B"
      mem2tib: "memory = 2199023255552.B"
      mem4tib: "memory = 4398046511104.B"
      mem8tib: "memory = 8796093022208.B"
      mem16tib: "memory = 17592186044416.B"
      mem32tib: "memory = 35184372088832.B"
      mem64tib: "memory = 70368744177664.B"
      mem128tib: "memory = 140737488355328.B"
      mem256tib: "memory = 281474976710656.B"
      mem512tib: "memory = 562949953421312.B"
      cpu1: "cpus = 1"
      cpu2: "cpus = 2"
      cpu5: "cpus = 5"
      cpu10: "cpus = 10"
      cpu20: "cpus = 20"
      cpu50: "cpus = 50"
      cpu100: "cpus = 100"
      cpu200: "cpus = 200"
      cpu500: "cpus = 500"
      cpu1000: "cpus = 1000"
    script:
    - "includeConfig(\"nextflow_labels.config\")"
  debug: false
  container: "docker"
engines:
- type: "docker"
  id: "docker"
  image: "nvidia/cuda:13.1.2-runtime-ubuntu24.04"
  namespace_separator: "/"
  setup:
  - type: "docker"
    env:
    - "PIP_BREAK_SYSTEM_PACKAGES=1"
  - type: "apt"
    packages:
    - "python3-pip"
    - "python-is-python3"
    interactive: false
  - type: "docker"
    run:
    - "pip install --upgrade --no-cache-dir --ignore-installed pip"
  - type: "docker"
    run:
    - "cat > /NOTICE <<'EOF'\nThis image contains software provided by NVIDIA Corporation\n\
      and is governed by the NVIDIA Deep Learning Container License:\nhttps://developer.download.nvidia.com/licenses/NVIDIA_Deep_Learning_Container_License.pdf\n\
      \nThe source code for this project is licensed under MIT:\nhttps://github.com/openpipelines-bio/openpipeline_rapids\n\
      EOF"
  - type: "docker"
    run:
    - "pip install --no-cache-dir --extra-index-url=https://pypi.nvidia.com \\\n \
      \ \"rapids-singlecell-cu13==0.15.0\" \\\n  \"cudf-cu13==26.04.*\" \\\n  \"cuml-cu13==26.04.*\"\
      \ \\\n  \"cugraph-cu13==26.04.*\" \\\n  \"cuvs-cu13==26.04.*\""
  - type: "python"
    user: false
    packages:
    - "mudata~=0.3.2"
    upgrade: true
  test_setup:
  - type: "apt"
    packages:
    - "git"
    interactive: false
  - type: "python"
    user: false
    packages:
    - "viashpy==0.8.0"
    github:
    - "openpipelines-bio/core#subdirectory=packages/python/openpipeline_testutils"
    upgrade: true
  entrypoint: []
  cmd: null
build_info:
  config: "src/squidpy/spatial_autocorr/config.vsh.yaml"
  runner: "executable"
  engine: "docker"
  output: "target/executable/squidpy/spatial_autocorr"
  executable: "target/executable/squidpy/spatial_autocorr/spatial_autocorr"
  viash_version: "0.9.7"
  git_commit: "a3ed55837728c41d6f1f6861d767161965bc0dc2"
  git_remote: "https://github.com/openpipelines-bio/openpipeline_rapids"
package_config:
  name: "openpipeline_rapids"
  version: "build_main"
  summary: "Best-practice workflows for single-cell multi-omics analyses using rapids-singlecell.\n"
  description: "OpenPipelines are extensible single cell analysis pipelines for reproducible\
    \ and large-scale single cell processing using [Viash](https://viash.io) and [Nextflow](https://www.nextflow.io/).\n\
    \nThis repository contains GPU-enabled components using the [rapids-singlecell](https://rapids-singlecell.readthedocs.io/en/latest/)\
    \ library.\n"
  info:
    test_resources:
    - type: "s3"
      path: "s3://openpipelines-data/pbmc_1k_protein_v3"
      dest: "resources_test/pbmc_1k_protein_v3"
    - type: "s3"
      path: "s3://openpipelines-bio/openpipeline_spatial/resources_test/xenium"
      dest: "resources_test/xenium"
    nextflow_labels_ci:
    - path: "src/workflows/utils/labels_ci.config"
      description: "Adds the correct memory and CPU labels when running on the Viash\
        \ Hub CI."
  repositories:
  - type: "vsh"
    name: "openpipeline"
    repo: "openpipeline"
    tag: "v4.1.0"
  - type: "vsh"
    name: "openpipeline_spatial"
    repo: "openpipeline_spatial"
    tag: "v0.5.0"
  viash_version: "0.9.7"
  source: "src"
  target: "target"
  config_mods:
  - ".resources += {path: '/src/workflows/utils/labels.config', dest: 'nextflow_labels.config'}\n\
    .runners[.type == 'nextflow'].config.script := 'includeConfig(\"nextflow_labels.config\"\
    )'\n"
  keywords:
  - "single-cell"
  - "multimodal"
  - "rapids"
  license: "MIT"
  organization: "openpipelines-bio"
  links:
    repository: "https://github.com/openpipelines-bio/openpipeline_rapids"
    docker_registry: "ghcr.io"
    homepage: "https://openpipelines.bio"
    documentation: "https://openpipelines.bio/fundamentals"
    issue_tracker: "https://github.com/openpipelines-bio/openpipeline_rapids/issues"
