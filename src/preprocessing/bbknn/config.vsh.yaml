name: bbknn
namespace: "preprocessing"
scope: "public"
description: |
  Compute a batch-balanced nearest-neighbor graph of observations on the GPU.

  Wraps rapids-singlecell's `rsc.pp.bbknn`. For each cell it finds the nearest
  neighbors within every batch separately and then merges them, correcting for
  batch effects in the neighbor graph. The resulting graph is the basis for
  downstream embedding and clustering (e.g. UMAP, Leiden) and is stored in the
  same .uns/.obsp slots as a regular neighbor graph.

authors:
  - __merge__: /src/authors/jakub_majercik.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        alternatives: ["-i"]
        type: file
        description: Input h5mu file.
        direction: input
        required: true
        example: input.h5mu

      - name: "--modality"
        type: string
        default: "rna"
        required: false
        description: Which modality from the input MuData file to process.

      - name: "--obsm_input"
        type: string
        default: "X_pca"
        required: false
        description: Which .obsm slot to use as a starting embedding (use_rep).

      - name: "--batch_key"
        type: string
        required: true
        description: |
          Which .obs column holds the batch assignment. Neighbors are searched
          within each batch separately and then merged.

  - name: Outputs
    __merge__: [., /src/base/h5_compression_argument.yaml]
    arguments:
      - name: "--output"
        alternatives: ["-o"]
        type: file
        description: Output h5mu file containing the found neighbors.
        direction: output
        required: true
        default: output.h5mu

      - name: "--uns_output"
        type: string
        default: "neighbors"
        description: In which .uns slot to store the neighbor graph metadata.

      - name: "--obsp_distances"
        type: string
        default: "distances"
        description: In which .obsp slot to store the distance matrix between the resulting neighbors.

      - name: "--obsp_connectivities"
        type: string
        default: "connectivities"
        description: In which .obsp slot to store the connectivities matrix between the resulting neighbors.

      - name: "--overwrite"
        type: boolean
        default: true
        description: Allow overwriting the .uns/.obsp output slots if they already exist.

  - name: Options
    arguments:
      - name: "--neighbors_within_batch"
        type: integer
        default: 3
        min: 1
        description: |
          How many top neighbors to report for each batch. Total number of
          neighbors per cell is this value times the number of batches.

      - name: "--n_pcs"
        type: integer
        required: false
        min: 1
        description: |
          Number of dimensions of the `--obsm_input` representation to use.
          If not set, all available dimensions are used.

      - name: "--metric"
        type: string
        default: "euclidean"
        description: The distance metric to use.
        choices: [
          "l2", "chebyshev", "manhattan", "taxicab", "correlation",
          "inner_product", "euclidean", "canberra", "lp", "minkowski",
          "cosine", "jensenshannon", "linf", "cityblock", "l1", "haversine",
          "sqeuclidean", "hellinger", "jaccard"
        ]

      - name: "--algorithm"
        type: string
        default: "brute"
        choices: [ "brute", "cagra", "ivfflat", "ivfpq", "mg_ivfflat", "mg_ivfpq" ]
        description: |
          The KNN query algorithm to use (provided by cuVS). See
          https://docs.rapids.ai/api/cuvs/stable/ for details.
            - brute: Brute-force exact search computing all pairwise distances.
              Exact but the most expensive; best for smaller datasets.
            - cagra: GPU graph-based approximate search optimized for high
              query throughput on large datasets.
            - ivfflat: Inverted-file index that clusters vectors into lists and
              only searches the nearest lists. Approximate, faster than brute.
            - ivfpq: Inverted-file index combined with product quantization of
              the vectors. Approximate with a low memory footprint; scales to
              very large datasets.
            - mg_ivfflat: Multi-GPU variant of ivfflat.
            - mg_ivfpq: Multi-GPU variant of ivfpq.

      - name: "--trim"
        type: integer
        required: false
        min: 1
        description: |
          Trim the neighbors of each cell to these many top connectivities.
          May help with population independence and improve the tidiness of
          clustering. If not set, defaults to ten times the total number of
          neighbors per cell.

      - name: "--random_state"
        type: integer
        default: 0
        min: 0
        description: A random seed.

resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
  - path: /src/utils/compress_h5mu.py
  - path: /src/utils/anndata_io.py

test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/pbmc_1k_protein_v3

engines:
  - __merge__: /src/base/rapids_docker.yaml
    setup:
      - type: python
        __merge__: /src/base/requirements/mudata.yaml

runners:
  - type: executable
    docker_run_args: --gpus all
  - type: nextflow
    directives:
      label: [lowcpu, midmem, middisk, gpu]
