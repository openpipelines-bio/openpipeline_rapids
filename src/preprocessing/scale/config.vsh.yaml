name: scale
namespace: "preprocessing"
scope: "public"
description: |
  Scale data to unit variance and (optionally) zero mean.

  Standardizes the expression matrix gene-wise so that each feature has unit
  variance, optionally centering it to zero mean first. Values can be clipped
  after scaling via max_value. Wraps the rapids-singlecell
  rapids_singlecell.pp.scale function.

authors:
  - __merge__: /src/authors/jakub_majercik.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        alternatives: ["-i"]
        type: file
        description: Input h5mu file.
        direction: input
        required: true
        example: input.h5mu

      - name: "--modality"
        type: string
        default: "rna"
        required: false
        description: Which modality from the input MuData file to process.

      - name: "--input_layer"
        type: string
        required: false
        description: Input layer to use. By default, X is scaled.

  - name: Outputs
    __merge__: [., /src/base/h5_compression_argument.yaml]
    arguments:
      - name: "--output"
        alternatives: ["-o"]
        type: file
        description: Output h5mu file.
        direction: output
        required: true
        default: output.h5mu

      - name: "--output_layer"
        type: string
        required: false
        description: Output layer to use. By default, use X.

  - name: Options
    arguments:
      - name: "--zero_center"
        type: boolean
        default: true
        description: |
          If True, center the data to zero mean before scaling. If False,
          omit zero-centering, which preserves sparsity.

      - name: "--max_value"
        type: double
        required: false
        description: |
          Clip (truncate) values to this maximum after scaling. By default,
          values are not clipped.

resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
  - path: /src/utils/compress_h5mu.py
  - path: /src/utils/anndata_io.py
  - path: /src/utils/gpu.py

test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/pbmc_1k_protein_v3

engines:
  - __merge__: /src/base/rapids_docker.yaml
    setup:
      - type: python
        __merge__: /src/base/requirements/mudata.yaml

runners:
  - type: executable
    docker_run_args: --gpus all
  - type: nextflow
    directives:
      label: [midmem, lowcpu, highdisk, gpu]
