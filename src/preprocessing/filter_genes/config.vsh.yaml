name: filter_genes
namespace: "preprocessing"
scope: "public"
description: |
  Filter genes based on number of counts or cells.

  Keep genes that have at least min_counts counts or are expressed in at least
  min_cells cells, or at most max_counts counts or are expressed in at most
  max_cells cells. At least one threshold must be provided.

  Wraps the rapids-singlecell rsc.pp.filter_genes function.

authors:
  - __merge__: /src/authors/jakub_majercik.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        alternatives: ["-i"]
        type: file
        description: Input h5mu file.
        direction: input
        required: true
        example: input.h5mu

      - name: "--modality"
        type: string
        default: "rna"
        required: false
        description: Which modality from the input MuData file to process.

  - name: Outputs
    __merge__: [., /src/base/h5_compression_argument.yaml]
    arguments:
      - name: "--output"
        alternatives: ["-o"]
        type: file
        description: Output h5mu file.
        direction: output
        required: true
        default: output.h5mu

  - name: Options
    arguments:
      - name: "--min_counts"
        type: integer
        required: false
        description: |
          Minimum number of counts required for a gene to pass filtering.

      - name: "--min_cells"
        type: integer
        required: false
        description: |
          Minimum number of cells expressing a gene required for it to pass
          filtering.

      - name: "--max_counts"
        type: integer
        required: false
        description: |
          Maximum number of counts allowed for a gene to pass filtering.

      - name: "--max_cells"
        type: integer
        required: false
        description: |
          Maximum number of cells expressing a gene allowed for it to pass
          filtering.

resources:
  - type: python_script
    path: script.py
  - path: /src/utils/setup_logger.py
  - path: /src/utils/compress_h5mu.py
  - path: /src/utils/anndata_io.py
  - path: /src/utils/gpu.py

test_resources:
  - type: python_script
    path: test.py
  - path: /resources_test/pbmc_1k_protein_v3

engines:
  - __merge__: /src/base/rapids_docker.yaml
    setup:
      - type: python
        __merge__: /src/base/requirements/mudata.yaml

runners:
  - type: executable
    docker_run_args: --gpus all
  - type: nextflow
    directives:
      label: [lowcpu, midmem, middisk, gpu]
