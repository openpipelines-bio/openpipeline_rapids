name: neighbors_leiden_umap
namespace: "wrappers/multiomics"
scope: "private"
description: |
  Performs neighborhood search, Leiden clustering and UMAP on an integrated
  embedding, running either the GPU (rapids-singlecell) or the CPU (scanpy)
  variant of the whole workflow, selected with --device_type.

authors:
  - __merge__: /src/authors/jakub_majercik.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        required: true
        type: file
        description: Path to the input H5MU file.
        example: dataset.h5mu
      - name: "--obsm_input"
        type: string
        required: true
        description: The key of the embedding to use as input.
      - name: "--modality"
        type: string
        description: Which modality to process.
        default: "rna"
        required: false

  - __merge__: /src/base/compute_argument_group.yaml

  - name: Outputs
    arguments:
      - name: "--output"
        type: file
        required: true
        direction: output
        description: Destination path to the output.
        example: output.h5mu

  - name: Neighbour calculation
    arguments:
      - name: "--uns_neighbors"
        type: string
        required: true
        description: In which .uns slot to store various neighbor output objects.
      - name: "--obsp_neighbor_distances"
        type: string
        required: true
        description: "In which .obsp slot to store the distance matrix between the resulting neighbors."
      - name: "--obsp_neighbor_connectivities"
        type: string
        required: true
        description: "In which .obsp slot to store the connectivities matrix between the resulting neighbors."

  - name: Clustering options
    arguments:
      - name: "--obs_cluster"
        type: string
        required: false
        description: |
          Prefix for the .obs keys under which to add the cluster labels. Newly created columns in .obs will
          be created from the specified value for '--obs_cluster' suffixed with an underscore and one of the
          resolutions specified in '--leiden_resolution'.
      - name: "--leiden_resolution"
        type: double
        description: Control the coarseness of the clustering. Higher values lead to more clusters.
        default: [1]
        multiple: true

  - name: UMAP options
    arguments:
      - name: "--obsm_umap"
        type: string
        required: false
        description: |
          In which .obsm slot to store the resulting UMAP embedding.
          When not specified, UMAP will not be executed.

dependencies:
  - name: workflows/multiomics/neighbors_leiden_umap
    alias: neighbors_leiden_umap_gpu
  - name: workflows/multiomics/neighbors_leiden_umap
    repository: openpipeline
    alias: neighbors_leiden_umap_cpu

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf

test_resources:
  - type: nextflow_script
    path: test.nf
    entrypoint: test_wf
  - path: /resources_test/pbmc_1k_protein_v3

runners:
  - type: nextflow
