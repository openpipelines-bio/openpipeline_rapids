name: process_gpu
namespace: "workflows/benchmark"
scope: "public"
description: |
  Bulk benchmark pipeline chaining every GPU rapids-singlecell component in
  this repository into a single run. Intended for timing the full stack on a
  GPU compute environment (e.g. Seqera Platform) and comparing the runtime to
  the equivalent CPU pipeline (workflows/benchmark/process_cpu).

  This workflow is not meant to produce meaningful biological results; it
  exercises every component end to end.

  Chain:
    log_normalize           (normalize_total + log1p)
      -> highly_variable_genes
      -> pca                  (.obsm["X_pca"])
      -> neighbors_leiden_umap (neighbors + leiden + umap)
      -> spatial_autocorr     (Moran's I)

  The input must already contain a spatial neighbourhood graph in
  .obsp["spatial_connectivities"] for the spatial_autocorr step.

authors:
  - __merge__: /src/authors/jakub_majercik.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        required: true
        type: file
        description: Path to the input H5MU file (spatial data with raw counts).
        example: dataset.h5mu
      - name: "--modality"
        type: string
        description: Which modality to process.
        default: "rna"
        required: false

  - name: Outputs
    arguments:
      - name: "--output"
        type: file
        required: true
        direction: output
        description: Destination path to the output.
        example: output.h5mu

dependencies:
  - name: workflows/rna/log_normalize
  - name: preprocessing/highly_variable_genes
  - name: preprocessing/pca
  - name: workflows/multiomics/neighbors_leiden_umap
  - name: squidpy/spatial_autocorr

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf

test_resources:
  - type: nextflow_script
    path: test.nf
    entrypoint: test_wf
  - path: /resources_test/xenium

runners:
  - type: nextflow
