name: process_cpu
namespace: "workflows/benchmark"
scope: "public"
description: |
  CPU counterpart of workflows/benchmark/process_gpu. Chains the equivalent
  OpenPipeline CPU components into the same pipeline so the total runtime can be
  compared 1:1 against the GPU rapids-singlecell stack on the same input.

  This workflow is not meant to produce meaningful biological results; it
  exercises every component end to end.

  Chain:
    log_normalize           (normalize_total + log1p)
      -> highly_variable_features_scanpy
      -> pca                  (.obsm["X_pca"])
      -> neighbors_leiden_umap (find_neighbors + leiden + umap)
      -> spatial_autocorr     (Moran's I)

  The input must already contain a spatial neighbourhood graph in
  .obsp["spatial_connectivities"] for the spatial_autocorr step.

authors:
  - __merge__: /src/authors/jakub_majercik.yaml
    roles: [ author ]

argument_groups:
  - name: Inputs
    arguments:
      - name: "--input"
        required: true
        type: file
        description: Path to the input H5MU file (spatial data with raw counts).
        example: dataset.h5mu
      - name: "--modality"
        type: string
        description: Which modality to process.
        default: "rna"
        required: false

  - name: Outputs
    arguments:
      - name: "--output"
        type: file
        required: true
        direction: output
        description: Destination path to the output.
        example: output.h5mu

dependencies:
  - name: workflows/rna/log_normalize
    repository: openpipeline
  - name: feature_annotation/highly_variable_features_scanpy
    repository: openpipeline
  - name: dimred/pca
    repository: openpipeline
  - name: workflows/multiomics/neighbors_leiden_umap
    repository: openpipeline
  - name: feature_annotation/spatial_autocorr
    repository: openpipeline_spatial

resources:
  - type: nextflow_script
    path: main.nf
    entrypoint: run_wf

test_resources:
  - type: nextflow_script
    path: test.nf
    entrypoint: test_wf
  - path: /resources_test/xenium

runners:
  - type: nextflow
